<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b4332">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OLI">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231b4332'/><text y='.9em' font-size='70' x='50%' dominant-baseline='middle' text-anchor='middle'>🛒</text></svg>">
<title>OLI</title>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    const sw=`
const CACHE='oli-v1';
const ASSETS=['./'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
self.addEventListener('fetch',e=>{
  if(e.request.url.includes('cdnjs.cloudflare.com')){
    e.respondWith(caches.open(CACHE).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res}))));
    return;
  }
  e.respondWith(caches.open(CACHE).then(c=>c.match(e.request).then(r=>r||fetch(e.request))));
});
`;
    const blob=new Blob([sw],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#edf4ef;--surface:#f8fdf9;--primary:#2d6a4f;--primary-dark:#1b4332;
  --danger:#dc2626;--success:#1a7a45;--warning:#d97706;
  --text:#0f2419;--muted:#5a7060;--border:#c8dece;--radius:10px;
  --shadow-green:#1b4332;--light-green:#d8ede0;--mid-green:#4a8c64;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
/* shadow-green topbar */

/* ── Layout ── */
.app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:56px 1fr;height:100vh}
.topbar{grid-column:1/-1;background:var(--shadow-green);border-bottom:1px solid #132e20;display:flex;align-items:center;padding:0 20px;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px}
.topbar-spacer{flex:1}
.tab-btn{padding:6px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);transition:all .15s}
.tab-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.tab-btn.active{background:#fff;color:var(--shadow-green);border-color:#fff;font-weight:700}
.left{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.right{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}

/* ── Search & Cats ── */
.search-bar{position:relative}
.search-bar input{width:100%;padding:9px 14px 9px 34px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none}
.search-bar input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat-btn{padding:4px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Product Grid ── */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:5px}
.product-card:hover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.15)}
.product-card:active{transform:scale(.97)}
.product-emoji{font-size:28px;text-align:center}
.product-name{font-size:12px;font-weight:600;line-height:1.3}
.product-sku{font-size:10px;color:var(--muted);font-family:monospace}
.product-price{font-size:13px;font-weight:700;color:var(--primary)}
.product-stock{font-size:11px;color:var(--muted)}
.product-card.out{opacity:.45;cursor:not-allowed}

/* ── Cart ── */
.cart-header{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.cart-clear{font-size:12px;color:var(--danger);background:none;border:none;cursor:pointer;font-weight:500}
.cart-items{flex:1;overflow-y:auto;padding:6px 0}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--muted);font-size:14px}
.cart-empty-icon{font-size:38px}
.cart-item{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border)}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;font-weight:500;color:var(--text)}
.cart-item-sku{font-size:10px;color:var(--muted);font-family:monospace}
.qty-ctrl{display:flex;align-items:center;gap:5px}
.qty-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text)}
.qty-btn:hover{border-color:var(--primary);color:var(--primary)}
.qty-num{font-size:13px;font-weight:600;min-width:18px;text-align:center;color:var(--text)}
.item-subtotal{font-size:13px;font-weight:600;min-width:50px;text-align:right;color:var(--primary)}
.remove-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:2px}
.remove-btn:hover{color:var(--danger)}

/* ── Totals ── */
.cart-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.totals{display:flex;flex-direction:column;gap:4px}
.totals-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.totals-row.total{font-size:16px;font-weight:700;margin-top:4px;border-top:1px solid var(--border);padding-top:6px;color:var(--text)}
.discount-row{display:flex;gap:6px}
.discount-row input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;background:var(--surface);color:var(--text)}
.discount-row input::placeholder{color:var(--muted)}
.discount-row input:focus{border-color:var(--primary)}
.checkout-btn{padding:11px;background:#22c55e;color:#0f2419;border:none;border-radius:var(--radius);font-size:15px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.3px}
.checkout-btn:hover{background:#16a34a;color:#fff}
.checkout-btn:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.3);cursor:not-allowed}

/* ── Full-page panels ── */
.full-panel{display:none;overflow-y:auto;padding:20px;flex-direction:column;gap:18px;grid-column:1/-1}
.full-panel.visible{display:flex}
.panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.panel-title{font-size:20px;font-weight:800}

/* ── History ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:800;color:var(--primary)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-title{font-size:14px;font-weight:700;margin-bottom:12px}
.chart-wrap{position:relative;height:180px}
.history-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.history-controls input[type=date],.history-controls select{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:var(--surface)}
.history-controls input[type=date]:focus,.history-controls select:focus{border-color:var(--primary)}
.btn-sm{padding:6px 14px;border:1px solid var(--border);border-radius:7px;font-size:13px;cursor:pointer;background:var(--surface);font-weight:500}
.btn-sm:hover{border-color:var(--primary);color:var(--primary)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg);padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--primary)}
thead th .sort-icon{font-size:11px;margin-left:4px;opacity:.5}
thead th.sort-asc .sort-icon::after{content:'↑';opacity:1;color:var(--primary)}
thead th.sort-desc .sort-icon::after{content:'↓';opacity:1;color:var(--primary)}
thead th:not(.sort-asc):not(.sort-desc) .sort-icon::after{content:'↕'}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg)}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-cash{background:#dcfce7;color:var(--success)}
.badge-card{background:#d1fae5;color:#065f46}
.badge-mobile{background:#fef3c7;color:var(--warning)}
.badge-check{background:#f3f4f6;color:var(--muted)}
.detail-link{color:var(--primary);cursor:pointer;font-weight:500}
.detail-link:hover{text-decoration:underline}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:14px}

/* ── Manage Products ── */
.sku-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sku-search{padding:7px 12px 7px 30px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;width:220px}
.sku-search:focus{border-color:var(--primary)}
.sku-search-wrap{position:relative}
.sku-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.manage-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.manage-table{width:100%;border-collapse:collapse;font-size:13px}
.manage-table th{background:var(--bg);padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
.manage-table td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.manage-table tr:last-child td{border-bottom:none}
.manage-table tr:hover td{background:var(--bg)}
.stock-low{color:var(--danger);font-weight:600}
.sku-tag{font-family:monospace;font-size:12px;background:var(--bg);padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:26px;width:440px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:16px;font-weight:700}
.modal-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.modal-row.total{font-weight:700;font-size:16px;border-top:1px solid var(--border);padding-top:7px;margin-top:5px}
.modal-divider{border:none;border-top:1px dashed var(--border);margin:12px 0}
.modal-items{display:flex;flex-direction:column;gap:4px}
.modal-item{display:flex;justify-content:space-between;font-size:13px}
.payment-section{margin-top:14px}
.payment-section>label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pay-method{padding:9px;border:2px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.pay-method.selected{border-color:var(--primary);background:#ecfdf5;color:var(--shadow-green)}
.cash-input{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-weight:600;outline:none}
.cash-input:focus{border-color:var(--primary)}
.change-display{background:#dcfce7;border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px;color:var(--success);margin-top:7px;text-align:center}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:var(--muted);border-color:var(--muted);cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{background:none}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.form-group label{font-size:13px;font-weight:600}
.form-group input,.form-group select{padding:8px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.help-text{font-size:11px;color:var(--muted);margin-top:2px}

/* ── Toast ── */
.toast-container{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:7px;z-index:200}
.toast{background:#1f2937;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;animation:slideIn .2s ease}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}

@media print{body{background:#fff}.no-print{display:none!important}}

/* ── Mobile Responsive ── */
@media(max-width:768px){

  /* Topbar: fixed at top, equal-width tabs */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:0 10px;gap:6px;height:52px;
  }
  .topbar h1{font-size:15px;white-space:nowrap}
  .topbar-spacer{flex:0 0 auto;min-width:6px}
  .tab-btn{flex:1;padding:6px 4px;font-size:11px;text-align:center;white-space:nowrap}

  /* Hide the desktop #app grid entirely */
  #app{display:none!important}

  /* Mobile panels: fixed full-screen slots below topbar */
  .m-panel{
    position:fixed;top:52px;left:0;right:0;bottom:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--bg);
    display:none;
  }
  .m-panel.m-active{display:block}

  /* Register panel */
  #posPanel{padding:10px 10px 80px;}
  .products{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
  .product-card{padding:10px 8px}
  .product-emoji{font-size:22px}

  /* History & Manage panels */
  #historyPanel{padding:12px 12px 80px;flex-direction:column;gap:14px}
  #managePanel{padding:12px 12px 80px;flex-direction:column;gap:14px}
  #historyPanel.m-active,#managePanel.m-active{display:flex}
  .stats-grid{grid-template-columns:1fr 1fr}
  .charts-grid{grid-template-columns:1fr}
  .history-controls{flex-wrap:wrap;gap:6px}
  .history-controls input[type=date],.history-controls select{font-size:12px;padding:5px 8px;flex:1;min-width:0}
  .manage-table-wrap{overflow-x:auto}
  .manage-table{min-width:580px}

  /* Cart: hidden slide-up sheet */
  #cartPanel{
    position:fixed!important;
    bottom:0;left:0;right:0;top:auto;
    height:72vh;z-index:90;
    border-radius:20px 20px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,.2);
    transform:translateY(110%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    display:flex!important;
    flex-direction:column;
    width:100%;
  }
  #cartPanel.cart-open{transform:translateY(0)}

  /* Cart drag handle */
  .cart-handle{
    display:flex!important;
    width:100%;justify-content:center;padding:10px 0 4px;cursor:pointer;flex-shrink:0;
  }
  .cart-handle-bar{width:40px;height:4px;background:rgba(255,255,255,.3);border-radius:4px}

  /* FAB */
  .cart-fab{
    display:flex!important;position:fixed;bottom:20px;right:20px;
    width:58px;height:58px;background:var(--primary);color:#fff;
    border-radius:50%;border:none;font-size:22px;cursor:pointer;
    align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(45,106,79,.5);z-index:89;
    flex-direction:column;gap:1px;
  }
  .cart-fab-count{
    font-size:10px;font-weight:800;background:#22c55e;
    border-radius:10px;padding:1px 5px;line-height:1.4;
  }
  .cart-fab-count:empty{display:none}

  /* Modals slide up from bottom */
  .modal{width:100%!important;max-width:100%!important;border-radius:20px 20px 0 0;margin:0;max-height:88vh;position:fixed;bottom:0;left:0;right:0}
  .modal-overlay.open{align-items:flex-end}

  /* Form rows single column */
  .form-row,.form-row3{grid-template-columns:1fr!important}

  /* Install banner & toast above FAB */
  #installBanner{bottom:84px}
  .toast-container{bottom:84px;right:14px}
}

/* Desktop: hide FAB and handle */
.cart-fab{display:none}
.cart-handle{display:none}
</style>
</head>
<body>
<div id="app" style="display:grid;grid-template-columns:1fr 380px;grid-template-rows:56px 1fr;height:100vh">

<!-- TOP BAR -->
<div class="topbar no-print" style="grid-column:1/-1">
  <span style="font-size:22px">🛒</span>
  <h1>OLI</h1>
  <div class="topbar-spacer"></div>
  <button class="tab-btn active" data-tab="pos" onclick="showTab('pos',this)">Register</button>
  <button class="tab-btn" data-tab="history" onclick="showTab('history',this)">Sales History</button>
  <button class="tab-btn" data-tab="manage" onclick="showTab('manage',this)">Products / SKUs</button>
</div>

<!-- LEFT: Register -->
<div class="left m-panel m-active" id="posPanel">
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search by name or SKU…" oninput="renderProducts()">
  </div>
  <div class="cats" id="catBar"></div>
  <div class="products" id="productGrid"></div>
</div>

<!-- RIGHT: Cart -->
<div class="right" id="cartPanel">
  <div class="cart-handle" onclick="toggleCart()"><div class="cart-handle-bar"></div></div>
  <div class="cart-header">
    <span>Cart <span id="cartCount" style="color:var(--muted);font-weight:400;font-size:13px"></span></span>
    <button class="cart-clear" onclick="clearCart()">Clear all</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="discount-row">
      <input type="number" id="discountInput" placeholder="Discount %" min="0" max="100" oninput="renderTotals()">
      <input type="number" id="taxInput" placeholder="Tax %" min="0" value="8.5" oninput="renderTotals()">
    </div>
    <div class="totals" id="totals"></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="openCheckout()" disabled>Checkout</button>
  </div>
</div>

<!-- FULL PANEL: Sales History -->
<div class="full-panel m-panel" id="historyPanel">
  <div class="panel-header">
    <div class="panel-title">Sales History</div>
    <div class="history-controls">
      <input type="date" id="dateFrom" onchange="renderHistory()">
      <input type="date" id="dateTo" onchange="renderHistory()">
      <select id="payFilter" onchange="renderHistory()">
        <option value="">All Payment</option>
        <option value="cash">Cash</option>
        <option value="card">Card</option>
        <option value="mobile">Mobile</option>
        <option value="check">Check</option>
      </select>
      <button class="btn-sm" onclick="clearHistoryFilters()">Clear Filters</button>
      <button class="btn-sm" onclick="exportCSV()" style="border-color:var(--success);color:var(--success)">⬇ Export CSV</button>
    </div>
  </div>
  <div class="stats-grid" id="historyStats"></div>
  <div class="charts-grid" id="chartsGrid"></div>
  <div class="table-wrap" id="historyTable"></div>
</div>

<!-- FULL PANEL: Products / SKU Management -->
<div class="full-panel m-panel" id="managePanel">
  <div class="panel-header">
    <div class="panel-title">Products / SKUs</div>
    <div class="sku-toolbar">
      <div class="sku-search-wrap">
        <span class="sku-search-icon">🔍</span>
        <input class="sku-search" type="text" id="skuSearch" placeholder="Search name or SKU…" oninput="renderManage()">
      </div>
      <button class="btn btn-primary" onclick="openProductModal()">+ Add Product</button>
      <button class="btn" onclick="openBulkDelete()" style="border-color:var(--danger);color:var(--danger)">🗑 Bulk Delete</button>
    </div>
  </div>
  <div class="manage-table-wrap" id="skuTable"></div>
</div>
</div>

<!-- ── CHECKOUT MODAL ── -->

<script>
// ─── State ─────────────────────────────────────────────────────────────────
let products = JSON.parse(localStorage.getItem('pos_products2') || 'null') || [
  {id:1,sku:'BVRG-001',name:'Espresso',emoji:'☕',price:3.50,category:'Coffee',stock:100},
  {id:2,sku:'BVRG-002',name:'Latte',emoji:'🥛',price:5.00,category:'Coffee',stock:100},
  {id:3,sku:'BVRG-003',name:'Cappuccino',emoji:'☕',price:4.75,category:'Coffee',stock:100},
  {id:4,sku:'BVRG-004',name:'Green Tea',emoji:'🍵',price:3.00,category:'Tea',stock:80},
  {id:5,sku:'BVRG-005',name:'Chamomile',emoji:'🌼',price:3.25,category:'Tea',stock:60},
  {id:6,sku:'BKRY-001',name:'Croissant',emoji:'🥐',price:4.50,category:'Bakery',stock:20},
  {id:7,sku:'BKRY-002',name:'Muffin',emoji:'🧁',price:3.75,category:'Bakery',stock:15},
  {id:8,sku:'BKRY-003',name:'Bagel',emoji:'🥯',price:3.00,category:'Bakery',stock:25},
  {id:9,sku:'FOOD-001',name:'Caesar Salad',emoji:'🥗',price:9.50,category:'Food',stock:10},
  {id:10,sku:'FOOD-002',name:'Sandwich',emoji:'🥪',price:8.00,category:'Food',stock:12},
  {id:11,sku:'FOOD-003',name:'Pasta',emoji:'🍝',price:12.50,category:'Food',stock:8},
  {id:12,sku:'DRNK-001',name:'OJ',emoji:'🍊',price:4.00,category:'Drinks',stock:30},
  {id:13,sku:'DRNK-002',name:'Water',emoji:'💧',price:1.50,category:'Drinks',stock:50},
  {id:14,sku:'DRNK-003',name:'Smoothie',emoji:'🥤',price:6.50,category:'Drinks',stock:20},
];
let sales = JSON.parse(localStorage.getItem('pos_sales2') || '[]');
let cart = {};
let activeCategory = 'All';
let selectedPayment = 'cash';
let editingProductId = null;
let nextId = products.reduce((m,p)=>Math.max(m,p.id),0)+1;
let historySort = {col:'date',dir:'desc'};
let charts = {};

function saveProducts(){localStorage.setItem('pos_products2',JSON.stringify(products))}
function saveSales(){localStorage.setItem('pos_sales2',JSON.stringify(sales))}

// ─── SKU Generator ─────────────────────────────────────────────────────────
function genSku(category){
  const prefix = (category||'GEN').slice(0,4).toUpperCase().replace(/\s/g,'');
  const used = new Set(products.map(p=>p.sku));
  let n=1;
  while(used.has(`${prefix}-${String(n).padStart(3,'0')}`))n++;
  return `${prefix}-${String(n).padStart(3,'0')}`;
}

// ─── Categories ────────────────────────────────────────────────────────────
function getCategories(){return['All',...new Set(products.map(p=>p.category))]}

function renderCats(){
  document.getElementById('catBar').innerHTML=getCategories().map(c=>
    `<button class="cat-btn ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}

function setCategory(c){activeCategory=c;renderCats();renderProducts()}

// ─── Products (Register) ───────────────────────────────────────────────────
function renderProducts(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=products.filter(p=>
    (activeCategory==='All'||p.category===activeCategory)&&
    (p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))
  );
  const grid=document.getElementById('productGrid');
  grid.innerHTML=filtered.length===0
    ?`<div style="color:var(--muted);font-size:14px;grid-column:1/-1;padding:20px 0">No products found</div>`
    :filtered.map(p=>`
      <div class="product-card ${p.stock===0?'out':''}" onclick="${p.stock>0?`addToCart(${p.id})`:''}">
        <div class="product-emoji">${p.emoji}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-sku">${p.sku}</div>
        <div class="product-price">₱${p.price.toFixed(2)}</div>
        <div class="product-stock">${p.stock===0?'Out of stock':`${p.stock} left`}</div>
      </div>`).join('');
}

// ─── Cart ──────────────────────────────────────────────────────────────────
function addToCart(id){
  const p=products.find(x=>x.id===id);
  if(!p||p.stock===0)return;
  if(!cart[id])cart[id]=0;
  if(cart[id]>=p.stock){toast('Max stock reached');return}
  cart[id]++;
  renderCart();
  toast(`${p.emoji} ${p.name} added`);
}
function setQty(id,delta){
  cart[id]=(cart[id]||0)+delta;
  if(cart[id]<=0)delete cart[id];
  const p=products.find(x=>x.id==id);
  if(p&&cart[id]>p.stock)cart[id]=p.stock;
  renderCart();
}
function removeFromCart(id){delete cart[id];renderCart()}
function clearCart(){cart={};renderCart()}

function renderCart(){
  const keys=Object.keys(cart);
  const count=keys.reduce((s,k)=>s+cart[k],0);
  document.getElementById('cartCount').textContent=count?`(${count})`:'';
  const fab=document.getElementById('fabCount');
  if(fab)fab.textContent=count||'';
  const items=document.getElementById('cartItems');
  if(!keys.length){
    items.innerHTML=`<div class="cart-empty"><div class="cart-empty-icon">🛒</div><div>Cart is empty</div></div>`;
    document.getElementById('checkoutBtn').disabled=true;
  } else {
    items.innerHTML=keys.map(id=>{
      const p=products.find(x=>x.id==id);
      return `<div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${p.emoji} ${p.name}</div>
          <div class="cart-item-sku">${p.sku}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="setQty(${id},-1)">−</button>
          <span class="qty-num">${cart[id]}</span>
          <button class="qty-btn" onclick="setQty(${id},1)">+</button>
        </div>
        <div class="item-subtotal">₱${(p.price*cart[id]).toFixed(2)}</div>
        <button class="remove-btn" onclick="removeFromCart(${id})">✕</button>
      </div>`;
    }).join('');
    document.getElementById('checkoutBtn').disabled=false;
  }
  renderTotals();
}

function getCartTotals(){
  const subtotal=Object.keys(cart).reduce((s,id)=>{
    const p=products.find(x=>x.id==id);return s+(p?p.price*cart[id]:0);
  },0);
  const disc=parseFloat(document.getElementById('discountInput').value)||0;
  const tax=parseFloat(document.getElementById('taxInput').value)||0;
  const discAmt=subtotal*(disc/100);
  const taxAmt=(subtotal-discAmt)*(tax/100);
  return{subtotal,disc,discAmt,tax,taxAmt,total:subtotal-discAmt+taxAmt};
}

function renderTotals(){
  const{subtotal,disc,discAmt,tax,taxAmt,total}=getCartTotals();
  document.getElementById('totals').innerHTML=`
    <div class="totals-row"><span>Subtotal</span><span>₱${subtotal.toFixed(2)}</span></div>
    ${disc?`<div class="totals-row" style="color:var(--danger)"><span>Discount (${disc}%)</span><span>−₱${discAmt.toFixed(2)}</span></div>`:''}
    ${tax?`<div class="totals-row" style="color:var(--muted)"><span>Tax (${tax}%)</span><span>₱${taxAmt.toFixed(2)}</span></div>`:''}
    <div class="totals-row total"><span>Total</span><span>₱${total.toFixed(2)}</span></div>`;
}

// ─── Checkout ──────────────────────────────────────────────────────────────
function openCheckout(){
  const{subtotal,disc,discAmt,tax,taxAmt,total}=getCartTotals();
  document.getElementById('orderSummary').innerHTML=`
    <div class="modal-items">${Object.keys(cart).map(id=>{
      const p=products.find(x=>x.id==id);
      return `<div class="modal-item"><span>${p.emoji} ${p.name} × ${cart[id]}</span><span>₱${(p.price*cart[id]).toFixed(2)}</span></div>`;
    }).join('')}</div>
    <hr class="modal-divider">
    <div class="modal-row"><span>Subtotal</span><span>₱${subtotal.toFixed(2)}</span></div>
    ${disc?`<div class="modal-row" style="color:var(--danger)"><span>Discount (${disc}%)</span><span>−₱${discAmt.toFixed(2)}</span></div>`:''}
    ${tax?`<div class="modal-row" style="color:var(--muted)"><span>Tax (${tax}%)</span><span>₱${taxAmt.toFixed(2)}</span></div>`:''}
    <div class="modal-row total"><span>Total</span><span>₱${total.toFixed(2)}</span></div>`;
  document.getElementById('cashReceived').value='';
  document.getElementById('changeDisplay').style.display='none';
  document.getElementById('cashSection').style.display='block';
  document.querySelectorAll('.pay-method').forEach(b=>b.classList.remove('selected'));
  document.querySelector('.pay-method').classList.add('selected');
  selectedPayment='cash';
  document.getElementById('checkoutModal').classList.add('open');
}
function closeCheckout(){document.getElementById('checkoutModal').classList.remove('open')}
function selectPayment(m,el){
  selectedPayment=m;
  document.querySelectorAll('.pay-method').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('cashSection').style.display=m==='cash'?'block':'none';
}
function calcChange(){
  const{total}=getCartTotals();
  const totalRounded=parseFloat(total.toFixed(2));
  const paid=parseFloat(document.getElementById('cashReceived').value)||0;
  const d=document.getElementById('changeDisplay');
  if(paid>=totalRounded){d.style.display='block';d.textContent=`Change: ₱${(paid-totalRounded).toFixed(2)}`}
  else d.style.display='none';
}
function confirmSale(){
  const{subtotal,disc,discAmt,tax,taxAmt,total}=getCartTotals();
  const totalRounded=parseFloat(total.toFixed(2));
  if(selectedPayment==='cash'){
    const paid=parseFloat(document.getElementById('cashReceived').value)||0;
    if(paid<totalRounded){toast('Cash received is less than total','error');return}
  }
  Object.keys(cart).forEach(id=>{
    const p=products.find(x=>x.id==id);
    if(p)p.stock=Math.max(0,p.stock-cart[id]);
  });
  saveProducts();
  const sale={
    id:Date.now(),
    date:new Date().toISOString(),
    items:Object.keys(cart).map(id=>{
      const p=products.find(x=>x.id==id);
      return{sku:p.sku,name:p.name,emoji:p.emoji,qty:cart[id],price:p.price};
    }),
    subtotal,discAmt,taxAmt,total,disc,tax,
    payment:selectedPayment,
    cashReceived:selectedPayment==='cash'?parseFloat(document.getElementById('cashReceived').value)||0:null
  };
  sales.unshift(sale);saveSales();
  closeCheckout();clearCart();renderProducts();showReceipt(sale);
}

// ─── Receipt ───────────────────────────────────────────────────────────────
function showReceipt(sale){
  const d=new Date(sale.date);
  const change=sale.cashReceived?(sale.cashReceived-sale.total).toFixed(2):null;
  document.getElementById('receiptContent').innerHTML=`
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:26px">🛒</div>
      <div style="font-weight:800;font-size:17px">OLI</div>
      <div style="font-size:12px;color:var(--muted)">${d.toLocaleDateString()} ${d.toLocaleTimeString()}</div>
      <div style="font-size:12px;color:var(--muted)">Receipt #${sale.id.toString().slice(-6)}</div>
    </div>
    <hr class="modal-divider">
    <div class="modal-items" style="margin-bottom:10px">${sale.items.map(i=>
      `<div class="modal-item">
        <span>${i.emoji} ${i.name} × ${i.qty} <span style="font-size:11px;color:var(--muted);font-family:monospace">${i.sku}</span></span>
        <span>₱${(i.price*i.qty).toFixed(2)}</span>
      </div>`
    ).join('')}</div>
    <hr class="modal-divider">
    <div class="modal-row"><span>Subtotal</span><span>₱${sale.subtotal.toFixed(2)}</span></div>
    ${sale.discAmt?`<div class="modal-row" style="color:var(--danger)"><span>Discount (${sale.disc}%)</span><span>−₱${sale.discAmt.toFixed(2)}</span></div>`:''}
    ${sale.taxAmt?`<div class="modal-row" style="color:var(--muted)"><span>Tax (${sale.tax}%)</span><span>₱${sale.taxAmt.toFixed(2)}</span></div>`:''}
    <div class="modal-row total"><span>TOTAL</span><span>₱${sale.total.toFixed(2)}</span></div>
    ${sale.cashReceived?`<div class="modal-row"><span>Cash</span><span>₱${sale.cashReceived.toFixed(2)}</span></div>`:''}
    ${change?`<div class="modal-row" style="color:var(--success);font-weight:700"><span>Change</span><span>₱${change}</span></div>`:''}
    <div style="background:#dcfce7;border-radius:8px;padding:8px;text-align:center;margin:12px 0;font-weight:700;font-size:13px;color:var(--success)">
      ✅ ${sale.payment.charAt(0).toUpperCase()+sale.payment.slice(1)}
    </div>
    <div style="text-align:center;font-size:12px;color:var(--muted)">Thank you for your purchase!</div>
    <div class="modal-actions" style="justify-content:center;margin-top:16px">
      <button class="btn btn-ghost" onclick="document.getElementById('receiptModal').classList.remove('open')">Close</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
    </div>`;
  document.getElementById('receiptModal').classList.add('open');
}

// ─── Sales History ─────────────────────────────────────────────────────────
function getFilteredSales(){
  let s=[...sales];
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  const pay=document.getElementById('payFilter').value;
  if(from)s=s.filter(x=>x.date>=from);
  if(to)s=s.filter(x=>x.date<=to+'T23:59:59');
  if(pay)s=s.filter(x=>x.payment===pay);
  return s;
}

function sortSales(arr){
  const{col,dir}=historySort;
  return arr.slice().sort((a,b)=>{
    let av,bv;
    if(col==='date'){av=a.date;bv=b.date}
    else if(col==='total'){av=a.total;bv=b.total}
    else if(col==='items'){av=a.items.reduce((s,i)=>s+i.qty,0);bv=b.items.reduce((s,i)=>s+i.qty,0)}
    else if(col==='payment'){av=a.payment;bv=b.payment}
    if(av<bv)return dir==='asc'?-1:1;
    if(av>bv)return dir==='asc'?1:-1;
    return 0;
  });
}

function setSort(col){
  if(historySort.col===col)historySort.dir=historySort.dir==='asc'?'desc':'asc';
  else{historySort.col=col;historySort.dir='desc'}
  renderHistory();
}

function clearHistoryFilters(){
  document.getElementById('dateFrom').value='';
  document.getElementById('dateTo').value='';
  document.getElementById('payFilter').value='';
  renderHistory();
}

function renderHistory(){
  const filtered=getFilteredSales();
  const sorted=sortSales(filtered);

  // Stats
  const totalRev=filtered.reduce((s,x)=>s+x.total,0);
  const totalTx=filtered.length;
  const avgOrder=totalTx?totalRev/totalTx:0;
  const totalItems=filtered.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);
  document.getElementById('historyStats').innerHTML=`
    <div class="stat-card"><div class="stat-val">₱${totalRev.toFixed(2)}</div><div class="stat-label">Revenue</div></div>
    <div class="stat-card"><div class="stat-val">${totalTx}</div><div class="stat-label">Transactions</div></div>
    <div class="stat-card"><div class="stat-val">₱${avgOrder.toFixed(2)}</div><div class="stat-label">Avg Order</div></div>
    <div class="stat-card"><div class="stat-val">${totalItems}</div><div class="stat-label">Items Sold</div></div>`;

  // Charts
  renderCharts(filtered);

  // Table
  const thCls=c=>`sortable${historySort.col===c?' sort-'+historySort.dir:''}`;
  document.getElementById('historyTable').innerHTML=sorted.length===0
    ?`<div class="no-data">No sales match your filters</div>`
    :`<table>
        <thead><tr>
          <th class="${thCls('date')}" onclick="setSort('date')">Date / Time<span class="sort-icon"></span></th>
          <th class="${thCls('items')}" onclick="setSort('items')">Items<span class="sort-icon"></span></th>
          <th>SKUs</th>
          <th class="${thCls('payment')}" onclick="setSort('payment')">Payment<span class="sort-icon"></span></th>
          <th class="${thCls('total')}" onclick="setSort('total')">Total<span class="sort-icon"></span></th>
          <th></th>
        </tr></thead>
        <tbody>${sorted.map(s=>{
          const d=new Date(s.date);
          const itemCount=s.items.reduce((a,i)=>a+i.qty,0);
          const badgeCls={cash:'badge-cash',card:'badge-card',mobile:'badge-mobile',check:'badge-check'}[s.payment]||'';
          return `<tr>
            <td>${d.toLocaleDateString()} <span style="color:var(--muted)">${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></td>
            <td>${s.items.map(i=>i.emoji).join('')} <span style="color:var(--muted)">${itemCount} item${itemCount!==1?'s':''}</span></td>
            <td style="font-family:monospace;font-size:11px;color:var(--muted)">${s.items.map(i=>i.sku).join(', ')}</td>
            <td><span class="badge ${badgeCls}">${s.payment}</span></td>
            <td style="font-weight:700">₱${s.total.toFixed(2)}</td>
            <td><span class="detail-link" onclick="showSaleDetail(${s.id})">View</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
}

function renderCharts(filtered){
  // Destroy old charts
  Object.values(charts).forEach(c=>c.destroy());
  charts={};

  // Top products
  const prodMap={};
  filtered.forEach(s=>s.items.forEach(i=>{
    prodMap[i.name]=(prodMap[i.name]||0)+(i.price*i.qty);
  }));
  const topProds=Object.entries(prodMap).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Revenue by day (last 10 days of data, or all if fewer)
  const dayMap={};
  filtered.forEach(s=>{
    const day=s.date.slice(0,10);
    dayMap[day]=(dayMap[day]||0)+s.total;
  });
  const days=Object.keys(dayMap).sort().slice(-10);

  // Payment breakdown
  const payMap={};
  filtered.forEach(s=>{payMap[s.payment]=(payMap[s.payment]||0)+1});

  const chartsGrid=document.getElementById('chartsGrid');
  chartsGrid.innerHTML=`
    <div class="chart-card"><div class="chart-title">Top Products by Revenue</div><div class="chart-wrap"><canvas id="chartProds"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">Revenue by Day</div><div class="chart-wrap"><canvas id="chartDays"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">Payment Methods</div><div class="chart-wrap"><canvas id="chartPay"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">Order Value Distribution</div><div class="chart-wrap"><canvas id="chartDist"></canvas></div></div>`;

  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:'#f3f4f6'}}}};

  charts.prods=new Chart(document.getElementById('chartProds'),{type:'bar',data:{
    labels:topProds.map(([n])=>n),
    datasets:[{data:topProds.map(([,v])=>v),backgroundColor:'#2d6a4f',borderRadius:5}]
  },options:{...opts,plugins:{...opts.plugins,tooltip:{callbacks:{label:ctx=>`₱${ctx.raw.toFixed(2)}`}}}}});

  charts.days=new Chart(document.getElementById('chartDays'),{type:'line',data:{
    labels:days.map(d=>new Date(d+'T12:00:00').toLocaleDateString([],{month:'short',day:'numeric'})),
    datasets:[{data:days.map(d=>dayMap[d]),borderColor:'#2d6a4f',backgroundColor:'rgba(45,106,79,.12)',fill:true,tension:.4,pointRadius:4}]
  },options:{...opts,plugins:{...opts.plugins,tooltip:{callbacks:{label:ctx=>`₱${ctx.raw.toFixed(2)}`}}}}});

  const payColors={cash:'#16a34a',card:'#4a8c64',mobile:'#d97706',check:'#6b7280'};
  charts.pay=new Chart(document.getElementById('chartPay'),{type:'doughnut',data:{
    labels:Object.keys(payMap),
    datasets:[{data:Object.values(payMap),backgroundColor:Object.keys(payMap).map(k=>payColors[k]||'#9ca3af')}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:12}}}}}});

  // Distribution buckets
  const buckets={'$0–5':0,'$5–15':0,'$15–30':0,'$30–50':0,'$50+':0};
  filtered.forEach(s=>{
    if(s.total<5)buckets['$0–5']++;
    else if(s.total<15)buckets['$5–15']++;
    else if(s.total<30)buckets['$15–30']++;
    else if(s.total<50)buckets['$30–50']++;
    else buckets['$50+']++;
  });
  charts.dist=new Chart(document.getElementById('chartDist'),{type:'bar',data:{
    labels:Object.keys(buckets),
    datasets:[{data:Object.values(buckets),backgroundColor:'#818cf8',borderRadius:5}]
  },options:{...opts,plugins:{...opts.plugins,tooltip:{callbacks:{label:ctx=>`${ctx.raw} orders`}}}}});
}

function showSaleDetail(id){
  const s=sales.find(x=>x.id===id);
  if(s)showReceipt(s);
}

function exportCSV(){
  const filtered=getFilteredSales();
  if(!filtered.length){toast('No data to export','error');return}
  const rows=[['Date','Time','SKUs','Items','Payment','Subtotal','Discount','Tax','Total']];
  filtered.forEach(s=>{
    const d=new Date(s.date);
    rows.push([
      d.toLocaleDateString(),d.toLocaleTimeString(),
      s.items.map(i=>i.sku).join('; '),
      s.items.reduce((a,i)=>a+i.qty,0),
      s.payment,
      s.subtotal.toFixed(2),s.discAmt.toFixed(2),s.taxAmt.toFixed(2),s.total.toFixed(2)
    ]);
  });
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`sales_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('CSV exported','success');
}

// ─── Manage / SKU ──────────────────────────────────────────────────────────
function renderManage(){
  const q=(document.getElementById('skuSearch').value||'').toLowerCase();
  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)
  );
  document.getElementById('skuTable').innerHTML=filtered.length===0
    ?`<div class="no-data">No products found</div>`
    :`<table class="manage-table">
        <thead><tr>
          <th>SKU</th><th>Product</th><th>Category</th>
          <th>Net Cost</th><th>Profit</th><th>Margin</th><th>SRP</th><th>Stock</th><th style="width:120px">Actions</th>
        </tr></thead>
        <tbody>${filtered.map(p=>{
          const profit=p.cost>0?(p.price-p.cost):null;
          const margin=p.cost>0&&p.price>0?((p.price-p.cost)/p.price*100):null;
          return `<tr>
          <td><span class="sku-tag">${p.sku}</span></td>
          <td><span style="margin-right:6px">${p.emoji}</span>${p.name}</td>
          <td style="color:var(--muted)">${p.category}</td>
          <td style="color:var(--muted)">${p.cost>0?'₱'+p.cost.toFixed(2):'—'}</td>
          <td style="color:${profit!==null?(profit>=0?'var(--success)':'var(--danger)'):'var(--muted)'};font-weight:600">${profit!==null?'₱'+profit.toFixed(2):'—'}</td>
          <td style="color:${margin!==null?(margin>=0?'var(--success)':'var(--danger)'):'var(--muted)'}">${margin!==null?margin.toFixed(1)+'%':'—'}</td>
          <td style="font-weight:700;color:var(--primary)">₱${p.price.toFixed(2)}</td>
          <td class="${p.stock<=5?'stock-low':''}">${p.stock}${p.stock<=5?' ⚠':''}${p.stock===0?' (out)':''}</td>
          <td>
            <button class="edit-btn" onclick="openProductModal(${p.id})" style="padding:4px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;cursor:pointer;background:none;margin-right:4px">Edit</button>
            <button onclick="deleteProduct(${p.id})" style="padding:4px 10px;border:1px solid transparent;border-radius:5px;font-size:12px;cursor:pointer;background:none;color:var(--danger)">Delete</button>
          </td>
        </tr>`;}).join('')}</tbody>
      </table>`;
}

function calcPricing(source){
  const cost=parseFloat(document.getElementById('pCost').value)||0;
  const markup=parseFloat(document.getElementById('pMarkup').value)||0;
  const profit=parseFloat(document.getElementById('pProfit').value)||0;
  const srp=parseFloat(document.getElementById('pPrice').value)||0;

  if(source==='cost'||source==='markup'){
    if(cost>0&&markup>0){
      const newSrp=cost*(1+markup/100);
      document.getElementById('pPrice').value=newSrp.toFixed(2);
      document.getElementById('pProfit').value=(newSrp-cost).toFixed(2);
    }
  } else if(source==='profit'){
    if(cost>0&&profit>0){
      const newSrp=cost+profit;
      document.getElementById('pPrice').value=newSrp.toFixed(2);
      document.getElementById('pMarkup').value=((profit/cost)*100).toFixed(1);
    }
  } else if(source==='srp'){
    if(cost>0&&srp>cost){
      const newProfit=srp-cost;
      document.getElementById('pProfit').value=newProfit.toFixed(2);
      document.getElementById('pMarkup').value=((newProfit/cost)*100).toFixed(1);
    }
  }

  // Update preview
  const finalSrp=parseFloat(document.getElementById('pPrice').value)||0;
  const finalCost=parseFloat(document.getElementById('pCost').value)||0;
  const finalProfit=finalSrp-finalCost;
  const finalMargin=finalSrp>0?(finalProfit/finalSrp*100):0;
  const preview=document.getElementById('pricingPreview');
  if(finalSrp>0){
    preview.style.display='flex';
    preview.innerHTML=`
      <div><span style="color:var(--muted)">Cost</span><br><strong>₱${finalCost.toFixed(2)}</strong></div>
      <div><span style="color:var(--muted)">Profit</span><br><strong style="color:${finalProfit>=0?'var(--success)':'var(--danger)'}">₱${finalProfit.toFixed(2)}</strong></div>
      <div><span style="color:var(--muted)">Margin</span><br><strong style="color:${finalMargin>=0?'var(--success)':'var(--danger)'}">${finalMargin.toFixed(1)}%</strong></div>
      <div><span style="color:var(--muted)">SRP</span><br><strong style="color:var(--primary)">₱${finalSrp.toFixed(2)}</strong></div>`;
  } else {
    preview.style.display='none';
  }
}

function openProductModal(id){
  editingProductId=id||null;
  const p=id?products.find(x=>x.id===id):null;
  document.getElementById('productModalTitle').textContent=id?'Edit Product':'Add Product';
  document.getElementById('pEmoji').value=p?.emoji||'';
  document.getElementById('pSku').value=p?.sku||'';
  document.getElementById('pCat').value=p?.category||'';
  document.getElementById('pName').value=p?.name||'';
  document.getElementById('pPrice').value=p?.price||'';
  document.getElementById('pCost').value=p?.cost||'';
  document.getElementById('pMarkup').value=p?.markup||'';
  document.getElementById('pProfit').value=p?.profit||'';
  document.getElementById('pStock').value=p?.stock??'';
  document.getElementById('pricingPreview').style.display='none';
  if(p?.cost&&p?.price) calcPricing('srp');
  const dl=document.getElementById('catList');
  dl.innerHTML=getCategories().filter(c=>c!=='All').map(c=>`<option value="${c}">`).join('');
  document.getElementById('productModal').classList.add('open');
}
function closeProductModal(){document.getElementById('productModal').classList.remove('open')}

function saveProduct(){
  const name=document.getElementById('pName').value.trim();
  const price=parseFloat(document.getElementById('pPrice').value);
  const stock=parseInt(document.getElementById('pStock').value);
  const cat=document.getElementById('pCat').value.trim()||'General';
  const emoji=document.getElementById('pEmoji').value.trim()||'📦';
  const skuInput=document.getElementById('pSku').value.trim();
  const cost=parseFloat(document.getElementById('pCost').value)||0;
  const markup=parseFloat(document.getElementById('pMarkup').value)||0;
  const profit=parseFloat(document.getElementById('pProfit').value)||0;

  if(!name||isNaN(price)||isNaN(stock)){toast('Fill in all required fields','error');return}

  if(editingProductId){
    const p=products.find(x=>x.id===editingProductId);
    const sku=skuInput||p.sku;
    if(products.some(x=>x.sku===sku&&x.id!==editingProductId)){toast('SKU already in use','error');return}
    Object.assign(p,{name,price,stock,category:cat,emoji,sku,cost,markup,profit});
    toast('Product updated','success');
  } else {
    const sku=skuInput||genSku(cat);
    if(products.some(x=>x.sku===sku)){toast('SKU already in use','error');return}
    products.push({id:nextId++,sku,name,price,stock,category:cat,emoji,cost,markup,profit});
    toast('Product added','success');
  }
  saveProducts();closeProductModal();renderManage();renderCats();renderProducts();
}

function deleteProduct(id){
  const p=products.find(x=>x.id===id);
  if(!confirm(`Delete "${p.name}" (${p.sku})?`))return;
  products=products.filter(x=>x.id!==id);
  delete cart[id];
  saveProducts();renderManage();renderCats();renderProducts();renderCart();
  toast(`${p.name} deleted`);
}

// ─── Bulk Delete ───────────────────────────────────────────────────────────
function openBulkDelete(){
  document.getElementById('bulkSkus').value='';
  document.getElementById('bulkPreview').textContent='';
  document.getElementById('bulkModal').classList.add('open');
}
function closeBulkModal(){document.getElementById('bulkModal').classList.remove('open')}

document.addEventListener('DOMContentLoaded',()=>{
  const ta=document.getElementById('bulkSkus');
  if(ta)ta.addEventListener('input',()=>{
    const skus=parseBulkSkus();
    const found=skus.filter(s=>products.some(p=>p.sku===s));
    const notFound=skus.filter(s=>!products.some(p=>p.sku===s));
    let txt='';
    if(found.length)txt+=`Found: ${found.join(', ')}`;
    if(notFound.length)txt+=`${txt?' | ':''}Not found: ${notFound.join(', ')}`;
    document.getElementById('bulkPreview').textContent=txt;
  });
});

function parseBulkSkus(){
  return document.getElementById('bulkSkus').value
    .split(/[\n,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
}

function confirmBulkDelete(){
  const skus=parseBulkSkus();
  if(!skus.length){toast('Enter at least one SKU','error');return}
  const toDelete=products.filter(p=>skus.includes(p.sku));
  if(!toDelete.length){toast('No matching SKUs found','error');return}
  if(!confirm(`Delete ${toDelete.length} product(s): ${toDelete.map(p=>p.sku).join(', ')}?`))return;
  const ids=new Set(toDelete.map(p=>p.id));
  products=products.filter(p=>!ids.has(p.id));
  ids.forEach(id=>delete cart[id]);
  saveProducts();closeBulkModal();renderManage();renderCats();renderProducts();renderCart();
  toast(`${toDelete.length} product(s) deleted`,'success');
}

// ─── Tabs ──────────────────────────────────────────────────────────────────
function showTab(tab,el){
  const isMobile=window.innerWidth<=768;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');

  const pos=document.getElementById('posPanel');
  const cartPanel=document.getElementById('cartPanel');
  const hist=document.getElementById('historyPanel');
  const manage=document.getElementById('managePanel');
  const app=document.getElementById('app');

  if(isMobile){
    // Mobile: toggle .m-active on the correct panel, close cart
    document.querySelectorAll('.m-panel').forEach(p=>p.classList.remove('m-active'));
    cartPanel.classList.remove('cart-open');
    if(tab==='pos'){pos.classList.add('m-active')}
    else if(tab==='history'){hist.classList.add('m-active');renderHistory()}
    else if(tab==='manage'){manage.classList.add('m-active');renderManage()}
  } else {
    // Desktop: use the #app grid as before
    pos.style.display='none';
    cartPanel.style.display='none';
    hist.classList.remove('visible');
    manage.classList.remove('visible');
    if(tab==='pos'){
      pos.style.display='';
      cartPanel.style.display='';
      app.style.cssText='display:grid;grid-template-columns:1fr 380px;grid-template-rows:56px 1fr;height:100vh';
    } else {
      app.style.cssText='display:grid;grid-template-columns:1fr;grid-template-rows:56px 1fr;height:100vh';
      if(tab==='history'){hist.classList.add('visible');renderHistory()}
      else if(tab==='manage'){manage.classList.add('visible');renderManage()}
    }
  }
}

// ─── Mobile Cart Toggle ────────────────────────────────────────────────────
function toggleCart(){
  const panel=document.getElementById('cartPanel');
  panel.classList.toggle('cart-open');
}
// Close cart when tapping outside on mobile
document.addEventListener('click',e=>{
  const panel=document.getElementById('cartPanel');
  const fab=document.getElementById('cartFab');
  if(window.innerWidth<=768&&panel.classList.contains('cart-open')){
    if(!panel.contains(e.target)&&!fab.contains(e.target)){
      panel.classList.remove('cart-open');
    }
  }
});

// ─── Toast ─────────────────────────────────────────────────────────────────
function toast(msg,type){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className=`toast ${type||''}`;t.textContent=msg;c.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// ─── PWA Install ───────────────────────────────────────────────────────────
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  const banner=document.getElementById('installBanner');
  banner.style.display='flex';
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBanner').style.display='none';
  if(outcome==='accepted')toast('OLI installed!','success');
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBanner').style.display='none';
  toast('OLI installed successfully!','success');
});

// ─── Init ──────────────────────────────────────────────────────────────────
renderCats();renderProducts();renderCart();
</script>
